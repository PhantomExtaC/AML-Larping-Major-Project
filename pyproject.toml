[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-playground-backend"
version = "0.1.0"
description = "Explainable, Multi-Agent AML Simulation and Risk Investigation Platform"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["backend/tests"]
pythonpath = ["."]